<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Poke Uruguay</title>
<meta name="description" content="Poke Uruguay: Aventuras en tierras charruas. Un juego de criaturas 2D ambientado en el Uruguay.">
<meta name="theme-color" content="#14183a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="styles/main.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<!--APP-->
<main class="app">
  <section id="screen" class="screen" aria-label="Pantalla del juego">
    <canvas id="view" width="320" height="240"></canvas>
    <div id="ui" class="ui"></div>
    <div id="loader" class="loader">
      <div class="loader-flag" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>
      <h1 class="loader-title">Poke Uruguay</h1>
      <p class="loader-sub">Aventuras en tierras charruas</p>
      <div class="loader-track" role="progressbar" aria-label="Cargando"><div id="loader-bar" class="loader-bar"></div></div>
      <p class="loader-meta"><span id="loader-label">Cargando…</span> <span id="loader-pct">0%</span></p>
      <button id="loader-start" class="btn loader-start" type="button" hidden>Presioná una tecla o tocá para empezar</button>
    </div>
  </section>
  <nav id="touch" class="touch" aria-label="Controles táctiles">
    <div class="dpad">
      <button type="button" data-action="up" aria-label="Arriba">▲</button>
      <button type="button" data-action="left" aria-label="Izquierda">◀</button>
      <button type="button" data-action="right" aria-label="Derecha">▶</button>
      <button type="button" data-action="down" aria-label="Abajo">▼</button>
    </div>
    <button type="button" class="pill" data-action="start" aria-label="Menú">MENÚ</button>
    <div class="ab">
      <button type="button" class="btn-b" data-action="b" aria-label="B">B</button>
      <button type="button" class="btn-a" data-action="a" aria-label="A">A</button>
    </div>
  </nav>
</main>
<!--/APP-->
</body>
</html>
